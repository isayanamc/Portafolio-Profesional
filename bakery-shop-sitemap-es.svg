<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 240" width="1140" height="240">
  <g stroke="#AFA9EC" stroke-width="1.4" fill="none" opacity="0.6">
    <path d="M600,60 V85 H120 V110" />
    <path d="M600,60 V85 H340 V110" />
    <path d="M600,60 V85 H560 V110" />
    <path d="M600,60 V85 H780 V110" />
